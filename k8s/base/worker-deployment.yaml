apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: worker
          image: hfts-worker:dev
          ports:
            - containerPort: 10003
          envFrom:
            - configMapRef:
                name: hfts-config
            - secretRef:
                name: hfts-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 10003
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 10003
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 10003
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
