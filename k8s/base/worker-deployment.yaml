apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker-container
          image: hfts-worker:dev
          ports:
            - containerPort: 10003
          env:
            - name: HFTS_ENV
              value: "dev"
            - name: REDIS_URL
              value: "redis://host.docker.internal:10004"
            - name: PUBSUB_EMULATOR_HOST
              value: "host.docker.internal:10005"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@host.docker.internal:10006/high_frequency_tickets"
          livenessProbe:
            httpGet:
              path: /health
              port: 10003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"