apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: api
          image: hfts-api:dev
          ports:
            - containerPort: 10002
          envFrom:
            - configMapRef:
                name: hfts-config
            - secretRef:
                name: hfts-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 10002
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 10002
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 10002
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
