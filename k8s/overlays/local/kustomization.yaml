apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gateway.yaml
  - prometheus-nodeport.yaml
configMapGenerator:
  - name: hfts-config
    literals:
      - HFTS_ENV=dev
      - PUBSUB_EMULATOR_HOST=host.docker.internal:10005
  - name: prometheus-config
    files:
      - prometheus.yml
secretGenerator:
  - name: hfts-secret
    envs:
      - secret.local.env
replicas:
  - name: api
    count: 3