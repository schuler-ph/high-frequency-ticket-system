apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gateway.yaml
  - prometheus-nodeport.yaml
  - grafana-nodeport.yaml
configMapGenerator:
  - name: hfts-config
    literals:
      - HFTS_ENV=dev
      - PUBSUB_EMULATOR_HOST=hfts-pubsub:8085
  - name: prometheus-config
    files:
      - prometheus.yml
secretGenerator:
  - name: hfts-secret
    envs:
      - secret.local.env
  - name: grafana-admin
    literals:
      - GF_SECURITY_ADMIN_PASSWORD=admin
replicas:
  - name: api
    count: 3
