services:
  postgres:
    image: postgres:16-alpine
    container_name: hts-postgres
    ports:
      - "10006:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: high_frequency_tickets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d high_frequency_tickets"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hts-redis
    ports:
      - "10004:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: hts-redis-exporter
    ports:
      - "10009:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    platform: linux/amd64
    container_name: hts-pubsub
    ports:
      - "10005:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    environment:
      PUBSUB_PROJECT_ID: high-frequency-ticket-system
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: hts-prometheus
    ports:
      - "10007:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    container_name: hts-grafana
    ports:
      - "10008:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Serverseitiges Rendern von Panels als PNG (`pnpm spike:graphs`, ADR-030).
      # Die Callback-URL ist die Adresse, unter der der Renderer Grafana im
      # Compose-Netz erreicht — nicht localhost, das waere der Renderer selbst.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    depends_on:
      - prometheus
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:3.12.9
    container_name: hts-grafana-renderer
    ports:
      - "10010:8081"
    environment:
      # Ein Lasttest-Dashboard hat viele Serien; der Default-Timeout (30s) reicht
      # bei kaltem Chromium-Start nicht immer.
      RENDERING_TIMEOUT: "60"
      ENABLE_METRICS: "true"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
